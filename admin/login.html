<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Hive & Ash</title>
<link rel="icon" type="image/png" href="/img/logo-mark.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --black:#0d0d0d; --grey:#6f6f6f; --line:#e4e2dd; --off-white:#faf9f7; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif; background:var(--off-white); color:var(--black);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  .card{ width:100%; max-width:380px; background:#fff; border:1px solid var(--line); padding:40px 32px; }
  h1{ font-family:'Bebas Neue',sans-serif; font-size:32px; letter-spacing:0.02em; margin-bottom:4px; }
  p.sub{ font-family:'Space Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--grey); margin-bottom:28px; }
  label{ display:block; font-size:12px; font-weight:600; margin-bottom:6px; }
  input{ width:100%; padding:12px 14px; border:1px solid var(--line); font-family:inherit; font-size:14px; margin-bottom:18px; }
  input:focus{ outline:none; border-color:var(--black); }
  button{ width:100%; padding:13px; background:var(--black); color:#fff; border:none; font-weight:600; letter-spacing:0.03em; cursor:pointer; font-family:inherit; }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  .err{ background:#fdecec; color:#a33; padding:10px 12px; font-size:13px; margin-bottom:16px; display:none; }
  .err.show{ display:block; }
</style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="off">
    <h1>Admin</h1>
    <p class="sub">Hive & Ash Control Panel</p>
    <div class="err" id="errBox"></div>
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit" id="submitBtn">Sign In →</button>
  </form>

  <script>
    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('errBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.remove('show');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        window.location.href = '/admin/dashboard.html';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In →';
      }
    });
  </script>
</body>
</html>
