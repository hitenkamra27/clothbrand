<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — Hive &amp; Ash</title>
<link rel="icon" type="image/png" href="/img/logo-mark.png">
<link rel="apple-touch-icon" href="/img/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
<style>
  .reset-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .reset-card{
    width:100%;max-width:400px;padding:40px 32px;border:1px solid var(--line);background:var(--white);
  }
  .reset-brand{
    display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:28px;
  }
  .reset-brand img{width:28px;height:28px;}
  .reset-brand span{font-family:var(--display);font-size:20px;letter-spacing:0.02em;}
  .reset-title{font-family:var(--display);font-size:26px;text-align:center;margin-bottom:8px;}
  .reset-sub{font-size:13px;color:var(--grey);text-align:center;margin-bottom:26px;line-height:1.5;font-weight:300;}
  .reset-form{display:flex;flex-direction:column;gap:16px;}
  .reset-alt{font-size:12px;color:var(--grey);text-align:center;margin-top:14px;font-weight:300;}
  .reset-alt a{font-weight:600;color:var(--black);border-bottom:1px solid var(--black);}
</style>
</head>
<body>

  <div class="reset-wrap">
    <div class="reset-card">
      <a href="/" class="reset-brand">
        <img src="/img/logo-mark.png" alt="Hive & Ash mark">
        <span>Hive &amp; Ash</span>
      </a>

      <div id="resetFormState">
        <h1 class="reset-title">Reset your password</h1>
        <p class="reset-sub" id="resetSub">Enter a new password for your account.</p>

        <div class="account-toast" id="resetToast"></div>

        <form class="reset-form" id="resetForm">
          <div class="field">
            <label>New Password</label>
            <input type="password" id="resetPassword" placeholder="Minimum 8 characters" required minlength="8">
          </div>
          <div class="field">
            <label>Confirm Password</label>
            <input type="password" id="resetPasswordConfirm" placeholder="Re-enter password" required minlength="8">
          </div>
          <button class="account-submit" type="submit" id="resetSubmitBtn">Reset Password</button>
        </form>

        <p class="reset-alt"><a href="/">Back to Hive &amp; Ash</a></p>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  const formState = document.getElementById('resetFormState');
  const sub = document.getElementById('resetSub');
  const toast = document.getElementById('resetToast');
  const form = document.getElementById('resetForm');
  const submitBtn = document.getElementById('resetSubmitBtn');

  function showToast(text, type) {
    toast.textContent = text;
    toast.className = `account-toast show ${type || ''}`.trim();
  }

  if (!token) {
    form.hidden = true;
    sub.textContent = 'This reset link is missing its token — please use the link from your email, or request a new one from the Sign In panel.';
    return;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('resetPassword').value;
    const confirm = document.getElementById('resetPasswordConfirm').value;

    if (password.length < 8) {
      return showToast('Password must be at least 8 characters.', 'err');
    }
    if (password !== confirm) {
      return showToast('Passwords do not match.', 'err');
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Please wait…';
    try {
      const res = await fetch('/api/customers/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Something went wrong. Please try again.');

      form.hidden = true;
      sub.textContent = data.message || 'Your password has been reset. You can now sign in.';
      showToast('Password reset ✓', 'ok');
    } catch (err) {
      showToast(err.message, 'err');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Reset Password';
    }
  });
})();
</script>

</body>
</html>
